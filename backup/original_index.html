<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LevelUp English — v6 Mobile Tabs + Tests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f8fb;--card:#ffffff;--ink:#0d1b2a;--muted:#637083;--line:#e7edf5;
      --primary:#2563eb;--primary2:#06b6d4;--good:#16a34a;--warn:#f59e0b;--bad:#ef4444;
      --shadow:0 20px 60px rgba(15,23,42,.10);--radius:24px;
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    body.dark{--bg:#07111f;--card:#0b1628;--ink:#f4f7fb;--muted:#a2adbd;--line:#1d2a3d;--shadow:0 20px 60px rgba(0,0,0,.35)}
    a{text-decoration:none;color:inherit}.app{min-height:100vh;display:grid;grid-template-columns:290px 1fr}.sidebar{position:sticky;top:0;height:100vh;padding:24px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);border-right:1px solid var(--line);z-index:10}.dark .sidebar{background:rgba(11,22,40,.78)}
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 12px 30px rgba(37,99,235,.32)}.brand h1{font-size:19px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.nav{display:grid;gap:8px}.nav button,.ghost{border:0;background:transparent;color:var(--muted);font-weight:700;text-align:left;padding:13px 14px;border-radius:16px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px}.nav button:hover,.nav button.active,.ghost:hover{background:linear-gradient(135deg,rgba(37,99,235,.11),rgba(6,182,212,.11));color:var(--primary)}.side-bottom{position:absolute;bottom:24px;left:24px;right:24px}.mini-card{padding:16px;border-radius:20px;background:linear-gradient(135deg,rgba(37,99,235,.10),rgba(6,182,212,.10));border:1px solid var(--line)}.mini-card b{display:block}.mini-card span{color:var(--muted);font-size:13px}.main{padding:24px 28px 60px}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.search{display:flex;align-items:center;gap:10px;max-width:560px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 8px 30px rgba(15,23,42,.04)}.search input{border:0;outline:0;background:transparent;color:var(--ink);width:100%;font-size:14px}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pill,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:11px 14px;font-weight:800;cursor:pointer}.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 12px 28px rgba(37,99,235,.25)}.btn.danger{color:#fff;border:0;background:linear-gradient(135deg,#ef4444,#f97316)}.lang button{padding:9px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:900;cursor:pointer}.lang button.active{background:var(--ink);color:var(--card)}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:stretch}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}.hero-card{position:relative;overflow:hidden;min-height:310px;background:radial-gradient(circle at 80% 15%,rgba(6,182,212,.22),transparent 38%),radial-gradient(circle at 10% 10%,rgba(37,99,235,.22),transparent 36%),var(--card)}.tag{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:rgba(37,99,235,.10);color:var(--primary);font-size:13px;font-weight:900}.hero h2{font-size:48px;line-height:1.02;margin:22px 0 14px;letter-spacing:-1.6px}.hero p{color:var(--muted);font-size:16px;line-height:1.65;max-width:680px}.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.stat{padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.42)}.dark .stat{background:rgba(255,255,255,.03)}.stat b{font-size:24px;display:block}.stat span{color:var(--muted);font-size:12px;font-weight:700}.level-card h3{margin:0 0 12px;font-size:22px}.level-badge{width:128px;height:128px;border-radius:40px;margin:20px auto;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:42px;font-weight:1000;box-shadow:0 26px 50px rgba(37,99,235,.28)}.progress-wrap{height:12px;background:rgba(99,112,131,.16);border-radius:999px;overflow:hidden}.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:999px;width:0;transition:.4s}.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.course{position:relative;overflow:hidden;min-height:240px}.course:before{content:"";position:absolute;inset:-80px -80px auto auto;width:160px;height:160px;border-radius:50%;background:rgba(37,99,235,.10)}.course h3{font-size:24px;margin:12px 0 8px}.course p{color:var(--muted);line-height:1.55}.course .meta{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{font-size:12px;font-weight:900;color:var(--primary);border:1px solid rgba(37,99,235,.20);background:rgba(37,99,235,.07);padding:7px 10px;border-radius:999px}.lesson-list{display:grid;gap:12px}.lesson{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--card)}.lesson-left{display:flex;align-items:center;gap:14px}.lesson-icon{width:44px;height:44px;border-radius:16px;background:rgba(37,99,235,.10);display:grid;place-items:center;font-weight:900;color:var(--primary)}.lesson small{color:var(--muted)}.test-box{max-width:860px;margin:auto}.question h3{font-size:26px}.options{display:grid;gap:10px;margin:22px 0}.option{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:16px;cursor:pointer;font-weight:800}.option:hover{border-color:var(--primary);background:rgba(37,99,235,.06)}.option.selected{border-color:var(--primary);background:rgba(37,99,235,.12)}.admin-login{max-width:460px;margin:auto}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:13px;color:var(--muted);font-weight:900}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px 14px;background:var(--card);color:var(--ink);outline:none}.field textarea{min-height:110px;resize:vertical}.pay-card{display:grid;grid-template-columns:160px 1fr;gap:20px;align-items:center}.qr{width:160px;height:160px;border-radius:22px;background:linear-gradient(45deg,#fff 25%,#e8eef7 25%,#e8eef7 50%,#fff 50%,#fff 75%,#e8eef7 75%);background-size:22px 22px;border:10px solid #fff;box-shadow:0 10px 30px rgba(15,23,42,.12);position:relative}.qr:after{content:"QR";position:absolute;inset:0;display:grid;place-items:center;color:#111;font-weight:1000;font-size:30px;background:rgba(255,255,255,.64);border-radius:12px}.table{width:100%;border-collapse:separate;border-spacing:0 10px}.table th{font-size:12px;color:var(--muted);text-align:left}.table td{background:var(--card);padding:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.table td:first-child{border-left:1px solid var(--line);border-radius:16px 0 0 16px}.table td:last-child{border-right:1px solid var(--line);border-radius:0 16px 16px 0}.modal{position:fixed;inset:0;background:rgba(2,6,23,.58);display:none;place-items:center;padding:22px;z-index:100}.modal.show{display:grid}.modal-card{max-width:920px;width:100%;max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 90px rgba(0,0,0,.35);padding:26px}.video-box{aspect-ratio:16/9;border-radius:24px;background:linear-gradient(135deg,#111827,#1e40af);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:900;margin:18px 0}.audio-box{padding:16px;border:1px dashed var(--line);border-radius:18px;background:rgba(37,99,235,.06);margin:16px 0}.notice{border-left:4px solid var(--primary);background:rgba(37,99,235,.08);padding:14px 16px;border-radius:16px;color:var(--muted);line-height:1.55}.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:none;z-index:200;font-weight:800}.toast.show{display:block}.mobile-menu{display:none}

    .lesson-status{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.lesson-status .done{color:var(--good);font-weight:1000}.lesson-status .locked{color:var(--warn);font-weight:1000}.lesson-shell{display:grid;gap:16px}.lesson-module{border:1px solid var(--line);border-radius:22px;padding:18px;background:rgba(37,99,235,.035)}.lesson-module h3{margin:0 0 10px}.lesson-module p{line-height:1.7;color:var(--ink)}.vocab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.vocab-card{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card)}.vocab-card b{display:block}.vocab-card span{color:var(--ink);opacity:.82;font-size:13px;line-height:1.45}.quiz-card{border:1px solid var(--line);border-radius:20px;padding:16px;background:var(--card);margin:12px 0}.quiz-card h4{margin:0 0 12px;line-height:1.5;font-size:18px}.quiz-options{display:grid;gap:9px}.quiz-option{border:1px solid var(--line);border-radius:16px;padding:13px;background:var(--card);cursor:pointer;text-align:left;color:var(--ink);font-weight:800}.quiz-option:hover{border-color:var(--primary);background:rgba(37,99,235,.06)}.quiz-option.selected{border-color:var(--primary);background:rgba(37,99,235,.13)}.quiz-option.correct{border-color:var(--good);background:rgba(22,163,74,.12)}.quiz-option.wrong{border-color:var(--bad);background:rgba(239,68,68,.10)}.quiz-explain{font-size:13px;color:var(--ink);margin-top:10px;line-height:1.6}.feedback-box{margin-top:14px;border-radius:22px;padding:18px;border:1px solid var(--line);line-height:1.7;box-shadow:0 10px 30px rgba(15,23,42,.06)}.feedback-correct{background:linear-gradient(180deg,rgba(22,163,74,.12),rgba(22,163,74,.06));border-color:rgba(22,163,74,.34)}.feedback-wrong{background:linear-gradient(180deg,rgba(239,68,68,.09),rgba(249,115,22,.06));border-color:rgba(239,68,68,.32)}.feedback-title{font-weight:1000;margin-bottom:12px;font-size:18px;display:flex;align-items:center;gap:10px;color:var(--ink)}.feedback-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}.feedback-chip{padding:12px 14px;border-radius:16px;border:1px solid rgba(15,23,42,.08);background:rgba(255,255,255,.72)}.dark .feedback-chip{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.07)}.feedback-chip b{display:block;margin-bottom:6px;color:var(--ink);font-size:12px;letter-spacing:.2px;text-transform:uppercase}.feedback-chip span{display:block;color:var(--ink);font-weight:800;font-size:15px}.feedback-section{margin-top:12px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.65);border:1px solid rgba(15,23,42,.06)}.dark .feedback-section{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.06)}.feedback-section h5{margin:0 0 8px;font-size:14px;color:var(--ink)}.feedback-section p,.feedback-section li{margin:0;color:var(--ink);font-size:14px;line-height:1.75}.feedback-section ul{margin:0;padding-left:18px}.inline-bad{color:#b91c1c;font-weight:900}.inline-good{color:#15803d;font-weight:900}.answer-row{font-size:14px;color:var(--ink);margin-top:8px;line-height:1.65}.answer-row b{color:var(--ink)}.score-box{border-radius:20px;padding:16px;background:linear-gradient(135deg,rgba(37,99,235,.10),rgba(6,182,212,.10));border:1px solid var(--line);font-weight:900}.course-road{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.road-item{padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--card);font-size:13px}.road-item b{display:block;margin-bottom:4px}.task-list{display:grid;gap:8px}.task-list div{padding:10px;border-radius:14px;background:rgba(99,112,131,.08);color:var(--ink);line-height:1.55}
    @media(max-width:720px){.vocab-grid,.course-road{grid-template-columns:1fr}}

    @media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:16px}.mobile-menu{display:flex}.hero,.grid,.grid.two{grid-template-columns:1fr}.hero h2{font-size:35px}.topbar{height:auto;align-items:flex-start;flex-direction:column}.search{max-width:none}.pay-card{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.actions{width:100%}}


    /* v6 updates: mobile bottom nav, lesson tabs, better small-screen hero */
    .bottom-nav{display:none}
    .lesson-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px;padding:8px;background:rgba(99,112,131,.08);border:1px solid var(--line);border-radius:20px;position:sticky;top:0;z-index:2;backdrop-filter:blur(10px)}
    .lesson-tab{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:16px;padding:11px 14px;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:8px}
    .lesson-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 10px 24px rgba(37,99,235,.22)}
    .lesson-tab-panel{display:none}
    .lesson-tab-panel.active{display:block}
    @media(max-width:980px){
      body{padding-bottom:80px}
      .hero h2{font-size:28px}
      .mobile-menu{display:none!important}
      .bottom-nav{position:fixed;left:0;right:0;bottom:0;height:64px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);z-index:300;box-shadow:0 -12px 35px rgba(15,23,42,.10)}
      .bottom-nav button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900;font-size:18px;cursor:pointer;padding:4px 0}
      .bottom-nav button small{font-size:10px;font-weight:800;line-height:1;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .bottom-nav button.active{color:var(--primary)}
      .modal{padding:12px 10px 78px}
      .modal-card{max-height:84vh;padding:18px;border-radius:22px}
      .lesson-tabs{position:static;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
      .lesson-tab{justify-content:center;font-size:13px;padding:10px 8px}
    }
    @media(max-width:400px){.hero h2{font-size:22px}.bottom-nav button small{font-size:9px}.bottom-nav button{font-size:16px}}

  </style>
</head>
